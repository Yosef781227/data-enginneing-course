<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mock exam: question 18</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#F4F6FA}
a{color:#2F4AC0}a:hover{color:#1F3594}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:14px;border:0;background:#3B5BDB;color:#FFFFFF;font:inherit;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;box-shadow:0 2px 0 #2B44A8}
.btn:hover{background:#2F4AC0;color:#FFFFFF}
.ghost{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;background:#FFFFFF;border:1px solid #D7DCE6;color:#1C2433;font:inherit;font-weight:500;font-size:15px;cursor:pointer;text-decoration:none}
.ghost:hover{background:#F0F3F9;color:#1C2433}
.ghost.flagged{background:#FFF1E0;border-color:#FFB46B;color:#9A4A00}
.opt{display:flex;gap:16px;align-items:center;width:100%;text-align:left;min-height:58px;padding:14px 18px;border-radius:16px;border:2px solid #E2E6EE;background:#FFFFFF;font:inherit;font-size:16px;color:#1C2433;cursor:pointer;box-sizing:border-box}
.opt:hover{border-color:#B9C5F2}
.opt.sel{border-color:#3B5BDB;background:#EEF2FF}
.cell{height:36px;border-radius:9px;border:0;font:inherit;font-size:13px;font-weight:600;cursor:pointer;position:relative}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F6FA; font-family: Lexend, system-ui, sans-serif; color: #1C2433; display: flex; flex-direction: column;">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E6EE; padding: 12px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;">
    <div style="display: flex; flex-direction: column;">
      <span style="font-size: 12px; color: #5B6577;">Mock exam · attempt 3</span>
      <span style="font-size: 16px; font-weight: 600;">Question 18 of 45</span>
    </div>
    <div style="flex: 1 1 200px; height: 8px; border-radius: 99px; background: #EDF0F5; overflow: hidden;" aria-label="17 of 45 answered"><div style="width: 38%; height: 8px; border-radius: 99px; background: #3B5BDB;"></div></div>
    <div role="timer" aria-label="Time left" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 12px; background: #1C2433; color: #FFFFFF; font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M10 2h4"></path></svg>
      54:12
    </div>
    <button class="ghost" style="min-height: 44px;">Pause</button>
  </header>

  <div style="padding: 28px; box-sizing: border-box; flex-grow: 1;">
    <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
      <main style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border: 1px solid #E2E6EE; border-radius: 24px; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
        <span style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border-radius: 99px; background: #F0F2F6; color: #3D4657; font-size: 13px;">Data governance</span>
        <h1 style="margin: 0; font-size: 22px; line-height: 1.5; font-weight: 500;">In Unity Catalog, names have three levels: <code style="font-family: 'JetBrains Mono', monospace; font-size: 19px; background: #F0F2F6; padding: 2px 8px; border-radius: 8px;">___.schema.table</code>. Which object is the first level?</h1>
        <div role="radiogroup" aria-label="Answers" style="display: flex; flex-direction: column; gap: 12px;">
          <sc-for list="{{ opts }}" as="o" hint-placeholder-count="4">
            <button class="opt {{o.cls}}" role="radio" aria-checked="{{o.checked}}" onClick="{{ o.pick }}">
              <span style="width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: {{o.keyBg}}; color: {{o.keyFg}}; display: flex; align-items: center; justify-content: center; font-weight: 600;">{{o.key}}</span>
              {{o.text}}
            </button>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; padding-top: 8px; border-top: 1px solid #E2E6EE;">
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="ghost">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
              Back
            </button>
            <button class="ghost {{flagCls}}" onClick="{{ toggleFlag }}" aria-pressed="{{flagPressed}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
              {{flagLabel}}
            </button>
          </div>
          <button class="btn">Next question
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
          </button>
        </div>
      </main>

      <aside aria-labelledby="nav" style="flex: 1 1 300px; background: #FFFFFF; border: 1px solid #E2E6EE; border-radius: 24px; padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
        <h2 id="nav" style="margin: 0; font-size: 16px; font-weight: 600;">All questions</h2>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px;">
          <sc-for list="{{ cells }}" as="c" hint-placeholder-count="45">
            <button class="cell" style="background: {{c.bg}}; color: {{c.fg}}; box-shadow: {{c.ring}};" aria-label="{{c.aria}}">{{c.n}}</button>
          </sc-for>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 13px; color: #3D4657;">
          <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; border-radius: 4px; background: #3B5BDB;"></span>Answered</span>
          <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; border-radius: 4px; background: #FFB46B;"></span>Flagged</span>
          <span style="display: inline-flex; align-items: center; gap: 6px;"><span style="width: 12px; height: 12px; border-radius: 4px; background: #EDF0F5; border: 1px solid #D7DCE6;"></span>Not yet</span>
        </div>
        <div style="padding: 14px; border-radius: 14px; background: #F4F6FA; font-size: 13px; line-height: 1.55; color: #3D4657;">No hints in exam mode. You will see every explanation when you finish.</div>
        <a class="ghost" href="MockResults.dc.html" style="justify-content: center;">Finish exam</a>
      </aside>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: null, flag: false };
  }
  renderVals() {
    const s = this.state;
    const list = [['A', 'Metastore'], ['B', 'Catalog'], ['C', 'Volume'], ['D', 'Workspace']];
    const opts = list.map(([key, text]) => {
      const sel = s.pick === key;
      return { key, text, cls: sel ? 'sel' : '', checked: sel ? 'true' : 'false', keyBg: sel ? '#3B5BDB' : '#F0F2F6', keyFg: sel ? '#FFFFFF' : '#3D4657', pick: () => this.setState({ pick: key }) };
    });
    const flagged = [9, 14];
    const cells = Array.from({ length: 45 }, (_, i) => {
      const n = i + 1;
      let bg = '#EDF0F5', fg = '#3D4657', ring = 'none', aria = 'Question ' + n + ', not answered';
      if (n < 18) { bg = '#3B5BDB'; fg = '#FFFFFF'; aria = 'Question ' + n + ', answered'; }
      if (flagged.indexOf(n) > -1 || (n === 18 && s.flag)) { bg = '#FFB46B'; fg = '#5A2A00'; aria = 'Question ' + n + ', flagged'; }
      if (n === 18) { ring = '0 0 0 3px #1C2433'; if (s.pick && !s.flag) { bg = '#3B5BDB'; fg = '#FFFFFF'; } aria += ', current'; }
      return { n, bg, fg, ring, aria };
    });
    return {
      opts, cells,
      toggleFlag: () => this.setState({ flag: !s.flag }),
      flagCls: s.flag ? 'flagged' : '',
      flagPressed: s.flag ? 'true' : 'false',
      flagLabel: s.flag ? 'Flagged' : 'Flag for later'
    };
  }
}
</script>
</body>
</html>

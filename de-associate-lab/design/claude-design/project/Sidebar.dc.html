<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:46px;border-radius:12px;color:#3D4657;text-decoration:none;font-size:15px;font-weight:500;transition:background .15s,color .15s}
.nav:hover{background:#EEF1F7;color:#1C2433}
.nav.on{background:#EAEFFF;color:#2F4AC0;font-weight:600}
.nav .badge{margin-left:auto;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:#FFF1E0;color:#9A4A00}
</style>
</helmet>
<nav aria-label="Main" style="width: 248px; box-sizing: border-box; padding: 24px 16px 24px; display: flex; flex-direction: column; gap: 28px; background: #FFFFFF; font-family: Lexend, system-ui, sans-serif; color: #1C2433;">
  <div style="display: flex; align-items: center; gap: 12px; padding: 0 6px;">
    <div style="width: 40px; height: 40px; border-radius: 12px; background: #3B5BDB; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; letter-spacing: -0.5px;">DE</div>
    <div style="display: flex; flex-direction: column;">
      <span style="font-weight: 700; font-size: 18px; letter-spacing: -0.3px;">DE Lab</span>
      <span style="font-size: 12px; color: #5B6577;">Data Engineer Associate</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px;">
    <a class="nav {{c.today}}" href="Main.dc.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg>
      Today
    </a>
    <a class="nav {{c.labs}}" href="Labs.dc.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"></path><path d="M7 15h10"></path></svg>
      Labs
      <span style="margin-left: auto; font-size: 12px; color: #5B6577;">6/40</span>
    </a>
    <a class="nav {{c.practice}}" href="Practice.dc.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6"></path><path d="M12 17h.01"></path></svg>
      Practice
      <span class="badge">12 to review</span>
    </a>
    <a class="nav {{c.mock}}" href="MockStart.dc.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M10 2h4"></path></svg>
      Mock exam
    </a>
    <a class="nav {{c.progress}}" href="Progress.dc.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"></path><path d="M10 20V4"></path><path d="M16 20v-7"></path><path d="M22 20H2"></path></svg>
      Progress
    </a>
  </div>

  <div style="border-radius: 16px; background: #FFF6EC; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8590C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8.5z"></path></svg>
      <div style="display: flex; flex-direction: column;">
        <span style="font-weight: 600; font-size: 15px;">6-day streak</span>
        <span style="font-size: 12px; color: #6B4A2A;">Do one step today to keep it</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px;">
      <span style="height: 26px; border-radius: 8px; background: #FF922B; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">T</span>
      <span style="height: 26px; border-radius: 8px; background: #FF922B; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">F</span>
      <span style="height: 26px; border-radius: 8px; background: #FF922B; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">S</span>
      <span style="height: 26px; border-radius: 8px; background: #FF922B; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">S</span>
      <span style="height: 26px; border-radius: 8px; background: #FF922B; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">M</span>
      <span style="height: 26px; border-radius: 8px; background: #FF922B; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">T</span>
      <span style="height: 26px; border-radius: 8px; border: 2px dashed #FFB46B; box-sizing: border-box; color: #9A4A00; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;">W</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 6px;">
    <span style="font-size: 12px; color: #5B6577;">Exam day</span>
    <span style="font-size: 14px; font-weight: 600;">[YOUR EXAM DATE]</span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","labs","practice","mock","progress"],"default":"today"},"$preview":{"width":248,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'today';
    const c = {};
    ['today', 'labs', 'practice', 'mock', 'progress'].forEach((k) => { c[k] = k === a ? 'on' : ''; });
    return { c };
  }
}
</script>
</body>
</html>
